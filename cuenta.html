<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi cuenta</title><link rel="stylesheet" href="style.css?v=20261102-sync2"></head><body><main class="login"><a href="tablero.html">← Volver al tablero</a><h1>Mi cuenta</h1><p id="who"></p><form id="password-form"><label>Contraseña actual<input name="current" type="password" autocomplete="current-password" required maxlength="200"></label><label>Nueva contraseña (12 caracteres como mínimo)<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><button>Guardar contraseña</button></form><p id="message" role="status"></p><nav><a href="admin.html" id="admin-link" hidden>Administrar cuentas</a><button id="logout">Cerrar sesión</button></nav></main><script src="client.js?v=20261102-sync2"></script><script>tablero.api('me').then(u=>{document.querySelector('#who').textContent=u.name+' · '+u.username;document.querySelector('#admin-link').hidden=!u.admin}).catch(()=>location.replace('./'))</script></body></html>
