<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi cuenta</title><link rel="stylesheet" href="style.css?v=20261102-working1"></head><body><main class="login"><a href="tablero.html?v=20261102-working1">← Volver al tablero</a><h1>Mi cuenta</h1><p id="who"></p><form id="password-form"><label>Contraseña actual<input name="current" type="password" autocomplete="current-password" required maxlength="200"></label><label>Nueva contraseña (10 caracteres como mínimo)<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="200"></label><button>Guardar contraseña</button></form><p id="message" role="status"></p><nav><a href="admin.html?v=20261102-working1" id="admin-link" hidden>Administrar cuentas</a><button id="logout">Cerrar sesión</button></nav></main><script src="client.js?v=20261102-working1"></script><script>tablero.api('me').then(u=>{document.querySelector('#who').textContent='Usuario: '+u.username;document.querySelector('#admin-link').hidden=!u.admin}).catch(()=>location.replace('./'))</script></body></html>
